
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monster Mayhem FPS</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#080d16;color:white;font-family:Arial,sans-serif}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:rgba(8,14,25,.82);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px 16px;backdrop-filter:blur(8px)}
#stats{position:absolute;top:18px;left:18px;display:flex;gap:10px;flex-wrap:wrap}
.stat{font-weight:bold;font-size:15px}
#healthBar{width:150px;height:10px;background:#333;border-radius:8px;margin-top:6px;overflow:hidden}
#healthFill{height:100%;width:100%;background:#42df78;transition:width .2s}
#bossBar{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:min(380px,70vw);display:none;text-align:center}
#bossFill{height:10px;background:#ef4774;width:100%;border-radius:8px}
#crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:27px;font-weight:bold;text-shadow:0 0 5px black}
#weapon{position:absolute;right:35px;bottom:25px;font-size:13px;text-align:right}
#message{position:absolute;top:22%;left:50%;transform:translateX(-50%);font-size:20px;font-weight:bold;text-shadow:0 2px 5px black;text-align:center}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,7,14,.88);z-index:5}
#menu{width:min(600px,92vw);padding:30px;text-align:center;background:#121d30;border:1px solid #425675;border-radius:18px;box-shadow:0 20px 70px #000}
h1{font-size:clamp(30px,6vw,52px);margin:0 0 8px;color:#ffc94b}
#menu p{color:#c2cee0;line-height:1.5}
button{border:0;border-radius:10px;padding:13px 20px;font-size:16px;font-weight:bold;cursor:pointer;background:#ffc94b;color:#17130a;margin:7px}
button:hover{filter:brightness(1.12);transform:translateY(-1px)}
#upgrades{display:none;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.upgrade{background:#243650;color:white;border:1px solid #60799e;max-width:160px;min-height:100px}
.upgrade span{display:block;color:#c5d2e5;font-size:12px;font-weight:normal;margin-top:7px}
#hint{font-size:12px;color:#91a5c3}
#hitFlash{position:fixed;inset:0;border:0 solid rgba(255,50,70,0);pointer-events:none}
#hitFlash.damaged{border:12px solid rgba(255,50,70,.55)}
#toast{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);font-weight:bold;text-shadow:0 2px 5px black}
</style>
</head>
<body>
<div id="hud">
  <div id="stats">
    <div class="panel">
      <div class="stat">❤️ Health: <span id="health">100</span></div>
      <div id="healthBar"><div id="healthFill"></div></div>
    </div>
    <div class="panel stat">🌊 Wave: <span id="wave">1</span></div>
    <div class="panel stat">⭐ Score: <span id="score">0</span></div>
    <div class="panel stat">👾 Monsters: <span id="remaining">0</span></div>
  </div>
  <div id="bossBar" class="panel">
    <b>BIG GOOFY BOSS</b>
    <div id="bossFill"></div>
  </div>
  <div id="crosshair">+</div>
  <div id="message"></div>
  <div id="weapon" class="panel">
    <b>GOO BLASTER</b><br>
    <span id="weaponInfo">Damage: 25 | Fire rate: Normal</span>
  </div>
  <div id="toast"></div>
</div>
<div id="hitFlash"></div>

<div id="overlay">
  <div id="menu">
    <h1 id="menuTitle">MONSTER MAYHEM FPS</h1>
    <p id="menuText">Explore the arena, enter buildings, and survive waves of goofy monsters!</p>
    <p id="hint">WASD: Move · Mouse: Look · Hold Click or Q: Shoot · Space: Jump · Shift: Sprint</p>
    <button id="startBtn">START GAME</button>
    <div id="upgrades"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a9c5);
scene.fog = new THREE.Fog(0x87a9c5, 35, 105);

const camera = new THREE.PerspectiveCamera(78, innerWidth/innerHeight, .1, 180);
camera.rotation.order = "YXZ";

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd9ecff,0x53604b,2));

const sun = new THREE.DirectionalLight(0xffffff,2.1);
sun.position.set(-25,45,25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-65;
sun.shadow.camera.right=65;
sun.shadow.camera.top=65;
sun.shadow.camera.bottom=-65;
scene.add(sun);

const mat = (color,roughness=.85) =>
  new THREE.MeshStandardMaterial({color,roughness});

const materials = {
  ground:mat(0x687b59),
  wall:mat(0xb7a58a),
  wallDark:mat(0x766b5d),
  roof:mat(0x5a4540),
  wood:mat(0x805332),
  metal:mat(0x687989),
  dark:mat(0x252d3a),
  white:mat(0xf3f0dd),
  black:mat(0x171b23),
  red:mat(0xe85b57),
  green:mat(0x53bb73),
  blue:mat(0x4d8fe0),
  yellow:mat(0xf0c64e),
  purple:mat(0x9a67cf)
};

function box(parent,x,y,z,w,h,d,material,cast=true,receive=true){
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  mesh.position.set(x,y,z);
  mesh.castShadow=cast;
  mesh.receiveShadow=receive;
  parent.add(mesh);
  return mesh;
}

const floor = new THREE.Mesh(new THREE.PlaneGeometry(120,120),materials.ground);
floor.rotation.x=-Math.PI/2;
floor.receiveShadow=true;
scene.add(floor);

const grid = new THREE.GridHelper(120,60,0x71866a,0x71866a);
grid.position.y=.015;
scene.add(grid);

// Arena boundary
const boundaryMat=mat(0x46515d);
box(scene,0,3,-58,120,6,2,boundaryMat);
box(scene,0,3,58,120,6,2,boundaryMat);
box(scene,-58,3,0,2,6,120,boundaryMat);
box(scene,58,3,0,2,6,120,boundaryMat);

// Buildings with enterable doorways
const buildings=[];
const solidBoxes=[];

function addSolid(x,z,w,d){
  solidBoxes.push({x,z,w,d});
}

function building(x,z,w,d,wallHeight=5){
  const g=new THREE.Group();
  g.position.set(x,0,z);
  scene.add(g);

  const t=.45;
  const doorW=2.3;
  const doorH=3.1;

  box(g,0,.08,0,w,.16,d,materials.wallDark,false,true);

  box(g,0,wallHeight/2,-d/2,w,wallHeight,t,materials.wall);
  box(g,-w/2,wallHeight/2,0,t,wallHeight,d,materials.wall);
  box(g,w/2,wallHeight/2,0,t,wallHeight,d,materials.wall);

  const sideW=(w-doorW)/2;
  box(g,-(doorW/2+sideW/2),wallHeight/2,d/2,sideW,wallHeight,t,materials.wall);
  box(g,(doorW/2+sideW/2),wallHeight/2,d/2,sideW,wallHeight,t,materials.wall);
  box(g,0,(wallHeight+doorH)/2,d/2,doorW,wallHeight-doorH,t,materials.wall);

  box(g,0,wallHeight+.12,0,w+.5,.3,d+.5,materials.roof);

  box(g,-doorW/2-.12,doorH/2,d/2+.04,.2,doorH,.25,materials.wood);
  box(g,doorW/2+.12,doorH/2,d/2+.04,.2,doorH,.25,materials.wood);
  box(g,0,doorH,d/2+.04,doorW+.45,.2,.25,materials.wood);

  for(const side of [-1,1]){
    const win=box(g,side*(w/2+.02),2,-.2,.08,1.35,1.8,materials.metal,false);
    win.material=mat(0x8cc7d9,.3);
  }

  box(g,-w*.25,.55,-d*.2,1.8,1.1,1.1,materials.wood);
  box(g,w*.25,.4,-d*.25,1.2,.8,1.3,materials.metal);
  box(g,0,.3,-d*.38,1.6,.6,.5,materials.wood);

  addSolid(x,z-d/2,w,t);
  addSolid(x-w/2,z,t,d);
  addSolid(x+w/2,z,t,d);
  addSolid(x-(w+doorW)/4,z+d/2,(w-doorW)/2,t);
  addSolid(x+(w+doorW)/4,z+d/2,(w-doorW)/2,t);

  buildings.push({x,z,w,d});
}

building(-19,-15,13,12);
building(18,-17,14,13);
building(-20,20,13,12);
building(20,20,15,13);

// Outdoor cover
function crate(x,z,size=2){
  box(scene,x,size/2,z,size,size,size,materials.wood);
  box(scene,x,size+.04,z,size*1.02,.12,size*1.02,materials.wallDark);
  addSolid(x,z,size,size);
}
crate(-7,-5,2.3);
crate(8,7,2.5);
crate(0,-25,2.5);
crate(3,25,2.2);
crate(-32,0,2.3);
crate(32,0,2.3);

function lamp(x,z){
  box(scene,x,2.5,z,.25,5,.25,materials.dark);
  const light=new THREE.PointLight(0xffd58a,1.5,13);
  light.position.set(x,4.8,z);
  scene.add(light);
  const bulb=new THREE.Mesh(new THREE.SphereGeometry(.3,12,10),mat(0xffdf91));
  bulb.position.copy(light.position);
  scene.add(bulb);
}
lamp(-5,-34);
lamp(30,-3);
lamp(-33,17);
lamp(5,34);

// Player
const player={
  x:0,z:0,y:0,
  vy:0,
  yaw:0,
  pitch:0,
  health:100,
  maxHealth:100,
  speed:8,
  damage:25,
  fireDelay:330,
  lastShot:0,
  jumpPower:8,
  armor:0,
  spread:1,
  alive:true,
  invulnerable:0
};

camera.position.set(0,1.7,0);

// First-person blaster
const weapon=new THREE.Group();
camera.add(weapon);
weapon.position.set(.38,-.34,-.72);

const gunMat=mat(0x303b4c);
const gunAccent=mat(0xffc94b);
box(weapon,0,0,0,.2,.2,.65,gunMat);
box(weapon,0,.1,-.16,.25,.1,.34,gunAccent);
box(weapon,0,-.13,.12,.13,.23,.18,gunMat);

const muzzle=new THREE.Mesh(
  new THREE.CylinderGeometry(.07,.07,.16,12),
  mat(0x202630)
);
muzzle.rotation.x=Math.PI/2;
muzzle.position.set(0,0,-.37);
weapon.add(muzzle);

let enemies=[];
let projectiles=[];
let wave=1;
let score=0;
let spawnLeft=0;
let spawnTimer=0;
let running=false;
let paused=false;
let betweenWaves=false;
let pointerLocked=false;
let gameStarted=false;
let lastTime=0;
let toastTimer=0;
let jumpPressed=false;
let shooting=false;

const keys={};
const enemyColors=[0x55c875,0x9d6bd2,0xe9a94e,0x5da9dc,0xe56a82];

function makeHumanoid(color,boss=false){
  const group=new THREE.Group();
  const bodyMat=mat(color);
  const skinMat=mat(boss?0xffa66d:color);
  const darkMat=mat(0x292d38);
  const eyeMat=mat(0xffffff);
  const pupilMat=mat(0x171717);

  const scale=boss?1.65:1;
  const part=(x,y,z,w,h,d,m)=>{
    return box(group,x,y,z,w*scale,h*scale,d*scale,m);
  };

  part(0,1.35,0,.85,1.05,.48,bodyMat);
  part(0,1.2,.27,.52,.55,.12,skinMat);

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(.43*scale,18,14),skinMat
  );
  head.position.set(0,2.18*scale,0);
  head.castShadow=true;
  group.add(head);

  for(const s of [-1,1]){
    const ear=new THREE.Mesh(
      new THREE.SphereGeometry(.17*scale,12,10),skinMat
    );
    ear.position.set(s*.4*scale,2.25*scale,0);
    group.add(ear);
  }

  for(const s of [-1,1]){
    const eye=new THREE.Mesh(
      new THREE.SphereGeometry(.105*scale,12,10),eyeMat
    );
    eye.position.set(s*.16*scale,2.25*scale,.36*scale);
    group.add(eye);

    const pupil=new THREE.Mesh(
      new THREE.SphereGeometry(.05*scale,10,8),pupilMat
    );
    pupil.position.set(s*.16*scale,2.24*scale,.45*scale);
    group.add(pupil);
  }

  box(group,0,2.02*scale,.39*scale,.22*scale,.055*scale,.035*scale,darkMat);

  const arms=[];
  for(const s of [-1,1]){
    const arm=new THREE.Group();
    arm.position.set(s*.53*scale,1.7*scale,0);

    const upper=new THREE.Mesh(
      new THREE.CapsuleGeometry(.13*scale,.48*scale,4,8),bodyMat
    );
    upper.position.y=-.28*scale;
    arm.add(upper);

    const hand=new THREE.Mesh(
      new THREE.SphereGeometry(.17*scale,10,8),skinMat
    );
    hand.position.y=-.58*scale;
    arm.add(hand);
    group.add(arm);
    arms.push(arm);
  }

  const legs=[];
  for(const s of [-1,1]){
    const leg=new THREE.Group();
    leg.position.set(s*.22*scale,.9*scale,0);

    const limb=new THREE.Mesh(
      new THREE.CapsuleGeometry(.15*scale,.55*scale,4,8),darkMat
    );
    limb.position.y=-.34*scale;
    leg.add(limb);

    const foot=new THREE.Mesh(
      new THREE.BoxGeometry(.28*scale,.17*scale,.42*scale),skinMat
    );
    foot.position.set(0,-.68*scale,.1*scale);
    leg.add(foot);
    group.add(leg);
    legs.push(leg);
  }

  group.traverse(o=>{
    if(o.isMesh){
      o.castShadow=true;
      o.receiveShadow=true;
    }
  });

  return {group,arms,legs,scale};
}

function spawnEnemy(boss=false){
  let x,z;
  let tries=0;
  do{
    const angle=Math.random()*Math.PI*2;
    const radius=24+Math.random()*22;
    x=Math.cos(angle)*radius;
    z=Math.sin(angle)*radius;
    tries++;
  }while(Math.hypot(x-player.x,z-player.z)<13&&tries<20);

  const color=boss?0xe34b70:enemyColors[Math.floor(Math.random()*enemyColors.length)];
  const model=makeHumanoid(color,boss);
  model.group.position.set(x,0,z);
  scene.add(model.group);

  const hp=boss?500+wave*70:65+wave*12;
  enemies.push({
    ...model,
    x,z,
    hp,maxHp:hp,
    speed:(boss?2.1:2.5+Math.random()*1.1)+wave*.06,
    damage:boss?18:9,
    boss,
    phase:Math.random()*6.28,
    hit:0
  });
}

function clearEnemies(){
  for(const e of enemies)scene.remove(e.group);
  enemies=[];
  for(const p of projectiles)scene.remove(p.mesh);
  projectiles=[];
}

function startWave(){
  betweenWaves=false;
  spawnLeft=wave===1?6:Math.min(6+wave*2,28);
  if(wave%5===0)spawnLeft+=1;
  spawnTimer=.6;
  $("wave").textContent=wave;
  $("message").textContent="WAVE "+wave;
  setTimeout(()=>{
    if(!betweenWaves)$("message").textContent="";
  },1800);
}

function makeProjectile(direction){
  const mesh=new THREE.Mesh(
    new THREE.SphereGeometry(.12,10,8),
    mat(0xffd45b)
  );
  scene.add(mesh);

  const origin=camera.position.clone();
  origin.addScaledVector(direction,.9);
  mesh.position.copy(origin);

  projectiles.push({
    mesh,
    velocity:direction.clone().multiplyScalar(42),
    life:1.5,
    damage:player.damage
  });
}

function shoot(){
  if(!running||paused||betweenWaves||!player.alive)return;

  const now=performance.now();
  if(now-player.lastShot<player.fireDelay)return;
  player.lastShot=now;

  const direction=new THREE.Vector3();
  camera.getWorldDirection(direction);
  makeProjectile(direction);

  if(player.spread>1){
    for(let i=1;i<player.spread;i++){
      const side=(i%2===0?1:-1)*.07*Math.ceil(i/2);
      const extra=direction.clone();
      extra.x+=side;
      extra.normalize();

      const mesh=new THREE.Mesh(
        new THREE.SphereGeometry(.1,8,8),
        mat(0xffe58a)
      );
      scene.add(mesh);
      mesh.position.copy(camera.position).addScaledVector(extra,.9);
      projectiles.push({
        mesh,
        velocity:extra.multiplyScalar(42),
        life:1.5,
        damage:player.damage*.7
      });
    }
  }

  weapon.position.z=-.62;
  setTimeout(()=>weapon.position.z=-.72,65);
}

function showToast(text){
  $("toast").textContent=text;
  toastTimer=1.7;
}

function damagePlayer(amount){
  if(player.invulnerable>0||!player.alive)return;

  player.health-=Math.max(1,amount-player.armor);
  player.invulnerable=.35;

  $("hitFlash").classList.add("damaged");
  setTimeout(()=>$("hitFlash").classList.remove("damaged"),130);

  updateUI();
  if(player.health<=0)endGame();
}

function removeEnemy(index){
  const e=enemies[index];
  scene.remove(e.group);
  enemies.splice(index,1);
  score+=e.boss?500:100;
  $("score").textContent=score;

  if(enemies.length===0&&spawnLeft===0)finishWave();
}

function finishWave(){
  if(betweenWaves||!player.alive)return;

  betweenWaves=true;
  wave++;
  player.health=Math.min(player.maxHealth,player.health+18);
  updateUI();

  $("message").textContent="WAVE CLEARED!";
  showUpgrades();
}

function showUpgrades(){
  running=false;
  shooting=false;
  document.exitPointerLock?.();

  $("overlay").style.display="flex";
  $("menuTitle").textContent="CHOOSE AN UPGRADE";
  $("menuText").textContent="Pick one upgrade before the next wave!";
  $("startBtn").style.display="none";

  const area=$("upgrades");
  area.innerHTML="";
  area.style.display="flex";

  const choices=[
    ["💥 Stronger Blaster","+10 projectile damage",()=>player.damage+=10],
    ["⚡ Faster Blaster","Shoot 20% faster",()=>player.fireDelay=Math.max(90,player.fireDelay*.8)],
    ["❤️ Extra Health","+25 maximum health",()=>{player.maxHealth+=25;player.health+=25;}],
    ["👟 Speed Boost","Move faster",()=>player.speed+=1.2],
    ["🛡️ Armor","Reduce incoming damage",()=>player.armor+=2],
    ["🌟 Triple Shot","Fire extra projectiles",()=>player.spread=Math.min(5,player.spread+1)],
    ["🦘 Jump Boost","Jump higher",()=>player.jumpPower+=1.5]
  ];

  const selected=[];
  while(selected.length<3){
    const pick=choices[Math.floor(Math.random()*choices.length)];
    if(!selected.includes(pick))selected.push(pick);
  }

  selected.forEach(choice=>{
    const btn=document.createElement("button");
    btn.className="upgrade";
    btn.innerHTML="<b>"+choice[0]+"</b><span>"+choice[1]+"</span>";

    btn.onclick=()=>{
      choice[2]();
      area.style.display="none";
      $("overlay").style.display="none";
      $("startBtn").style.display="inline-block";
      $("message").textContent="";
      updateUI();
      startWave();
      running=true;
      renderer.domElement.requestPointerLock();
    };

    area.appendChild(btn);
  });
}

function endGame(){
  player.alive=false;
  running=false;
  shooting=false;
  document.exitPointerLock?.();

  $("overlay").style.display="flex";
  $("menuTitle").textContent="GAME OVER";
  $("menuText").textContent="You reached wave "+wave+" and scored "+score+" points!";
  $("startBtn").textContent="PLAY AGAIN";
  $("startBtn").style.display="inline-block";
  $("upgrades").style.display="none";
}

function updateUI(){
  $("health").textContent=Math.max(0,Math.ceil(player.health));
  $("healthFill").style.width=Math.max(0,player.health/player.maxHealth*100)+"%";
  $("score").textContent=score;
  $("wave").textContent=wave;
  $("remaining").textContent=enemies.length+spawnLeft;
  $("weaponInfo").textContent="Damage: "+player.damage+" | Fire rate: "+Math.round(1000/player.fireDelay)+" shots/sec";

  const boss=enemies.find(e=>e.boss);
  $("bossBar").style.display=boss?"block":"none";
  if(boss)$("bossFill").style.width=Math.max(0,boss.hp/boss.maxHp*100)+"%";
}

function canMove(x,z){
  const radius=.42;
  if(Math.abs(x)>55||Math.abs(z)>55)return false;

  for(const b of solidBoxes){
    const closestX=Math.max(b.x-b.w/2,Math.min(x,b.x+b.w/2));
    const closestZ=Math.max(b.z-b.d/2,Math.min(z,b.z+b.d/2));
    const dx=x-closestX,dz=z-closestZ;

    if(dx*dx+dz*dz<radius*radius)return false;
  }

  return true;
}

function updatePlayer(dt){
  const forward=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));
  const right=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));
  const move=new THREE.Vector3();

  if(keys.KeyW||keys.ArrowUp)move.add(forward);
  if(keys.KeyS||keys.ArrowDown)move.sub(forward);
  if(keys.KeyD||keys.ArrowRight)move.add(right);
  if(keys.KeyA||keys.ArrowLeft)move.sub(right);

  if(move.lengthSq()>0){
    move.normalize();
    const speed=player.speed*(keys.ShiftLeft||keys.ShiftRight?1.5:1);
    const nx=player.x+move.x*speed*dt;
    const nz=player.z+move.z*speed*dt;

    if(canMove(nx,player.z))player.x=nx;
    if(canMove(player.x,nz))player.z=nz;
  }

  if(keys.Space&&player.y<=.001&&!jumpPressed){
    player.vy=player.jumpPower;
    jumpPressed=true;
  }

  if(!keys.Space)jumpPressed=false;

  player.vy-=22*dt;
  player.y+=player.vy*dt;

  if(player.y<0){
    player.y=0;
    player.vy=0;
  }

  camera.position.set(player.x,1.7+player.y,player.z);
  camera.rotation.set(player.pitch,player.yaw,0,"YXZ");
}

function updateEnemies(dt,time){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    const dx=player.x-e.x;
    const dz=player.z-e.z;
    const dist=Math.hypot(dx,dz);

    if(dist>1.55){
      const step=e.speed*dt;
      e.x+=dx/dist*step;
      e.z+=dz/dist*step;
    }else{
      e.attackTimer=(e.attackTimer||0)-dt;
      if(e.attackTimer<=0){
        damagePlayer(e.damage);
        e.attackTimer=.8;
      }
    }

    e.group.position.set(e.x,0,e.z);
    e.group.rotation.y=Math.atan2(dx,dz);

    const swing=Math.sin(time*8+e.phase)*.55;
    e.legs[0].rotation.x=swing;
    e.legs[1].rotation.x=-swing;
    e.arms[0].rotation.x=-swing*.7;
    e.arms[1].rotation.x=swing*.7;
    e.group.position.y=Math.abs(Math.sin(time*8+e.phase))*.07;
  }
}

function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];
    p.mesh.position.addScaledVector(p.velocity,dt);
    p.life-=dt;

    let hit=false;

    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      const target=new THREE.Vector3(e.x,1.45*e.scale,e.z);

      if(p.mesh.position.distanceTo(target)<1.05*e.scale){
        e.hp-=p.damage;
        hit=true;

        if(e.hp<=0)removeEnemy(j);
        break;
      }
    }

    if(hit||p.life<=0){
      scene.remove(p.mesh);
      projectiles.splice(i,1);
    }
  }
}

function updateSpawning(dt){
  if(spawnLeft>0){
    spawnTimer-=dt;

    if(spawnTimer<=0){
      const boss=wave%5===0&&spawnLeft===1;
      spawnEnemy(boss);
      spawnLeft--;
      spawnTimer=Math.max(.35,1.1-wave*.025);
      updateUI();
    }
  }

  if(enemies.length===0&&spawnLeft===0&&!betweenWaves){
    finishWave();
  }
}

function startGame(){
  clearEnemies();

  player.x=0;
  player.z=0;
  player.y=0;
  player.vy=0;
  player.health=100;
  player.maxHealth=100;
  player.speed=8;
  player.damage=25;
  player.fireDelay=330;
  player.armor=0;
  player.spread=1;
  player.jumpPower=8;
  player.alive=true;
  player.yaw=0;
  player.pitch=0;
  player.invulnerable=0;

  shooting=false;
  wave=1;
  score=0;
  betweenWaves=false;

  $("score").textContent=0;
  $("overlay").style.display="none";
  $("upgrades").style.display="none";
  $("message").textContent="";

  updateUI();
  startWave();
  running=true;
  renderer.domElement.requestPointerLock();
}

$("startBtn").addEventListener("click",()=>{
  if(!gameStarted||!player.alive){
    gameStarted=true;
    startGame();
  }else if(paused){
    paused=false;
    running=true;
    $("overlay").style.display="none";
    renderer.domElement.requestPointerLock();
  }
});

document.addEventListener("pointerlockchange",()=>{
  pointerLocked=document.pointerLockElement===renderer.domElement;

  if(gameStarted&&player.alive&&!betweenWaves&&!pointerLocked){
    shooting=false;
    paused=true;
    running=false;

    $("overlay").style.display="flex";
    $("menuTitle").textContent="PAUSED";
    $("menuText").textContent="Click resume when you're ready to continue.";
    $("startBtn").textContent="RESUME";
    $("startBtn").style.display="inline-block";
    $("upgrades").style.display="none";
  }
});

// Faster mouse sensitivity
document.addEventListener("mousemove",e=>{
  if(!pointerLocked||!running)return;

  const sensitivity=.0045;

  player.yaw-=e.movementX*sensitivity;
  player.pitch-=e.movementY*sensitivity;
  player.pitch=Math.max(-1.48,Math.min(1.48,player.pitch));
});

// Keyboard controls
document.addEventListener("keydown",e=>{
  keys[e.code]=true;

  if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)){
    e.preventDefault();
  }
});

document.addEventListener("keyup",e=>{
  keys[e.code]=false;
});

// Hold left-click to shoot continuously
document.addEventListener("mousedown",e=>{
  if(e.button!==0)return;

  if(!pointerLocked&&gameStarted&&player.alive&&!betweenWaves){
    renderer.domElement.requestPointerLock();
  }

  shooting=true;
});

// Stop shooting when left-click is released
document.addEventListener("mouseup",e=>{
  if(e.button===0)shooting=false;
});

// Prevent stuck firing if the mouse leaves the window
window.addEventListener("blur",()=>{
  shooting=false;
  for(const key in keys)keys[key]=false;
});

// Main game loop
function animate(now){
  requestAnimationFrame(animate);

  const dt=Math.min((now-lastTime)/1000||0,.04);
  lastTime=now;
  const time=now/1000;

  if(running&&!paused&&player.alive){
    updatePlayer(dt);

    // Hold Q or left-click for automatic shooting
    if(shooting||keys.KeyQ){
      shoot();
    }

    updateEnemies(dt,time);
    updateProjectiles(dt);
    updateSpawning(dt);

    if(player.invulnerable>0){
      player.invulnerable-=dt;
    }

    if(toastTimer>0){
      toastTimer-=dt;
      if(toastTimer<=0)$("toast").textContent="";
    }

    updateUI();
  }

  renderer.render(scene,camera);
}

requestAnimationFrame(animate);

window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

updateUI();

})();
</script>
</body>
</html>
